build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  CyclomaticComplexMethod:
    active: false
  TooManyFunctions:
    active: false
  LargeClass:
    active: false
  LongMethod:
    active: true
    threshold: 20

exceptions:
  TooGenericExceptionThrown:
    active: false
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

naming:
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
  VariableNaming:
    active: true
    variablePattern: '[a-z][a-zA-Z0-9]*'
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][a-z0-9]*)*'
  EnumNaming:
    active: true
    enumEntryPattern: '[A-Z][_A-Z0-9]*'

style:
  ThrowsCount:
    active: false
  ReturnCount:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 140
  UnusedPrivateProperty:
    active: false
  MagicNumber:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  WildcardImport:
    active: true
  SpacingBetweenPackageAndImports:
    active: true
  TrailingWhitespace:
    active: true
  NewLineAtEndOfFile:
    active: true


